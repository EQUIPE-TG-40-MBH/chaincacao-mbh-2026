# Render Blueprint - ChainCacao Backend
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: chaincacao-api
    runtime: python
    region: frankfurt
    plan: free

    buildCommand: pip install -r requirements.txt
    preDeployCommand: |
      python manage.py migrate --noinput
      python manage.py collectstatic --noinput
    startCommand: gunicorn chaincacao.wsgi:application --bind 0.0.0.0:$PORT

    healthCheckPath: /api/health/

    pythonConfig:
      version: "3.11"

    envVars:
      - key: DATABASE_URL
        sync: false

      - key: SECRET_KEY
        generateValue: true

      - key: DEBUG
        value: "False"

      - key: ALLOWED_HOSTS
        value: "chaincacao-api.onrender.com,localhost,127.0.0.1"

      - key: CONTRACT_ADDRESS
        sync: false

      - key: AMOY_RPC_URL
        sync: false

      - key: EMAIL_HOST_USER
        sync: false

      - key: EMAIL_HOST_PASSWORD
        sync: false
